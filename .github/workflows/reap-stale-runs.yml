name: Reap Stale Bench Runs

concurrency:
  group: reap-stale-runs
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (no database writes)
        required: true
        type: boolean
        default: true
      stale_after_seconds:
        description: Only fail rows older than N seconds (0 = all in-flight)
        required: true
        type: number
        default: 0
      confirm:
        description: 'When dry_run is false, type "reap-stale" to confirm'
        required: false
        type: string
        default: ''
  # workflow_dispatch only works from the default branch; push here to test from a PR branch.
  push:
    branches:
      - ops/reap-stale-runs-workflow

jobs:
  validate:
    name: Validate inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation for live reap
        if: inputs.dry_run == false && inputs.confirm != 'reap-stale'
        run: |
          echo "Live reap cancelled. Set dry_run=true to preview, or type reap-stale in confirm."
          exit 1

  reap:
    name: Reap stale bench rows on swarm
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on:
      group: EC2
      labels: [self-hosted, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run reap_stale_runs.py in bench-api
        env:
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}
          STALE_AFTER_SECONDS: ${{ github.event_name == 'push' && '0' || inputs.stale_after_seconds }}
        run: |
          set -euo pipefail
          chmod +x ./s/lib.sh
          # shellcheck disable=SC1091
          . ./s/lib.sh
          container_id="$(docker ps --filter "name=bench-api" --format "{{.ID}}" | head -1)"
          if [[ -z "$container_id" ]]; then
            echo "bench-api container not found"
            docker ps --format '{{.Names}}' | grep -i bench || true
            exit 1
          fi
          image="$(docker inspect "$container_id" --format '{{.Config.Image}}')"
          config_name="$(swarm_env_config bench-api)"
          swarm_config_to_env_file "$config_name" "/tmp/bench-api_env.tmp"
          echo "container=$container_id image=$image"
          args=(--stale-after-seconds "$STALE_AFTER_SECONDS" --yes)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          docker run --rm \
            --network "$SWARM_NETWORK" \
            --env-file "/tmp/bench-api_env.tmp" \
            -v "$PWD/services/bench/scripts/reap_stale_runs.py:/tmp/reap_stale_runs.py:ro" \
            "$image" \
            python /tmp/reap_stale_runs.py "${args[@]}"
