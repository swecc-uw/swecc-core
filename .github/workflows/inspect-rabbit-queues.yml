name: Inspect RabbitMQ Queues

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Bench prod diagnose (MQ + services)
    timeout-minutes: 15
    runs-on:
      group: EC2
      labels: [self-hosted, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swarm bench service status
        run: |
          set -euo pipefail
          for svc in bench-api bench-worker bench-sandbox; do
            echo "========== $svc =========="
            docker service ps "$svc" --no-trunc 2>/dev/null || echo "(service missing)"
            echo "--- MQ-related env ---"
            docker service inspect "$svc" --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' 2>/dev/null \
              | grep -E '^(ORCH_MQ_|BENCH_RABBIT|RABBIT_HOST|RABBIT_PORT|RABBIT_VHOST)=' || echo "(none)"
          done
          echo "========== bench-api logs (last 60) =========="
          docker service logs bench-api --tail 60 2>&1 || true

      - name: Fix SWAG network aliases + Rabbit users
        run: |
          set -euo pipefail
          chmod +x ./s/lib.sh ./s/ops/rabbitmq.sh
          # shellcheck source=s/lib.sh
          . ./s/lib.sh
          for svc in bench-api bench-worker; do
            ./s/ops/rabbitmq.sh create-user "$svc" || true
          done
          for svc in bench-api bench-worker bench-sandbox; do
            swarm_ensure_gateway_alias "$svc"
            swarm_ensure_swag_network_alias "$svc"
          done

      - name: Internal bench-api health (swarm DNS)
        run: |
          set -euo pipefail
          chmod +x ./s/lib.sh
          # shellcheck source=s/lib.sh
          . ./s/lib.sh
          swarm_curl_bench_health

      - name: List RabbitMQ queues
        run: |
          set -euo pipefail
          container_id=$(docker ps --filter "name=rabbitmq-host" --format "{{.ID}}" | head -1)
          if [[ -z "$container_id" ]]; then
            echo "RabbitMQ container not found (filter: rabbitmq-host)"
            docker ps --format '{{.Names}}' | grep -i rabbit || true
            exit 1
          fi
          echo "container=$container_id"
          docker exec "$container_id" rabbitmqctl list_queues name messages messages_ready messages_unacknowledged consumers
          echo "--- bench.run-queue payloads (requeue after peek) ---"
          docker exec "$container_id" rabbitmqadmin get queue=bench.run-queue ackmode=ack_requeue_true count=20 2>/dev/null || true
          echo "--- bench.job-queue payloads (requeue after peek) ---"
          docker exec "$container_id" rabbitmqadmin get queue=bench.job-queue ackmode=ack_requeue_true count=20 2>/dev/null || true
