# TEMP: one-shot bench recovery — rm bench Swarm services and recreate via deploy.sh.
# Delete this workflow after prod is stable.
name: Redeploy Bench From Scratch

on:
  workflow_dispatch:

concurrency:
  group: redeploy-bench-from-scratch
  cancel-in-progress: false

jobs:
  redeploy:
    name: Reset and redeploy bench stack
    timeout-minutes: 45
    runs-on:
      group: EC2
      labels: [self-hosted, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Redeploy bench services from scratch
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BENCH_REDEPLOY_YES: "1"
          DEPLOY_ROLLOUT_TIMEOUT_SEC: 600
        run: |
          chmod +x ./s/ops/redeploy-bench-from-scratch.sh ./s/ops/deploy.sh ./s/lib.sh
          ./s/ops/redeploy-bench-from-scratch.sh --yes
