<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesocosm run status</title>
    <link rel="stylesheet" href="status-ui.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Run status</h1>
        <p class="lede">Live view of a bench run — polls <code>/v1/runs/status</code> until terminal.</p>
      </header>

      <section class="config card" id="config-panel">
        <label>
          Run ID
          <input type="text" id="run-id" placeholder="uuid from mesocosm run create" autocomplete="off" />
        </label>
        <label>
          API base
          <input type="url" id="api-base" placeholder="https://api.swecc.org/bench" />
        </label>
        <label>
          Bearer token <span class="hint">(optional — gallery_public runs may work without)</span>
          <input type="password" id="auth-token" placeholder="SWECC_BENCH_TOKEN" autocomplete="off" />
        </label>
        <div class="actions">
          <button type="button" id="start-btn">Watch run</button>
          <button type="button" id="stop-btn" class="ghost" disabled>Stop</button>
        </div>
      </section>

      <section class="card" id="run-panel" hidden>
        <div class="run-header">
          <span class="badge" id="run-status">—</span>
          <span class="run-id" id="run-id-display"></span>
        </div>
        <p class="reason" id="run-reason" hidden></p>
        <dl class="outcomes" id="run-outcomes" hidden></dl>
        <div class="scores" id="run-scores" hidden></div>
      </section>

      <section class="card" id="episodes-panel" hidden>
        <h2>Episodes</h2>
        <ul class="episode-list" id="episode-list"></ul>
      </section>

      <p class="error" id="error" hidden></p>
      <footer>
        <small>
          Scaffolded by <code>mesocosm init</code>. Serve this folder:
          <code>cd showcase && python -m http.server 8080</code>
        </small>
      </footer>
    </main>
    <script src="run-status.js"></script>
  </body>
</html>
