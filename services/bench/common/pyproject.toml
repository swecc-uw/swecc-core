[project]
name = "bench_common"
version = "0.1.0"
description = "Shared runtime kernel for BenchAnything (monorepo internal; PyPI users install swecc-mesocosm)."
requires-python = ">=3.11"
dependencies = [
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Bench storage uses Django ORM (the bench app lives in services/server/server/bench/).
    # bench-api calls django.setup() at boot to use these models in standalone mode.
    "Django>=4.2,<5.0",
    "psycopg[binary]>=3.1",
    "aiofiles>=24.0",
    "httpx>=0.27",
    "litellm>=1.50",
    "structlog>=24.0",
    "websockets>=13.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_common"]
# NOTE: do not add a force-include for bench_common/cli/templates — `packages`
# already ships every file under bench_common/ (including non-.py template
# files), so force-including the same paths makes hatchling add each file
# twice and fail the build ("A second file is being added ... at the same
# path"). See git history for the duplicate-inclusion regression.

[tool.ruff]
target-version = "py311"
line-length = 120
